name: Refresh recent visits

on:
  schedule:
    - cron: '17 * * * *'   # hourly (offset from the top of the hour)
  workflow_dispatch: {}      # allow manual runs

permissions:
  contents: write

concurrency:
  group: recent-visits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/recent-visits.json from GoatCounter export
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node tools/build-recent-visits.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/recent-visits.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/recent-visits.json
            git commit -m "chore: refresh recent visits [skip ci]"
            git push
          else
            echo "no change"
          fi
